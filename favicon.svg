<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with subtle glow -->
  <rect width="64" height="64" rx="16" fill="#07090e"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#pbg)" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Energetic Speed / Cosmic Bolt -->
  <path d="M36 10L18 34H33L28 54L48 28H32L36 10Z" fill="url(#pbg)" filter="url(#glow)"/>
